<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="pageTitle">Project · Adrian Taboada Perez</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<!-- NAV -->
<nav>
  <a class="nav-logo" href="index.html">ATP // PORTFOLIO</a>
  <ul class="nav-links">
    <li><a href="index.html#projects">All Projects</a></li>
    <li><a href="index.html#skills">Skills</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>

<main class="project-page" id="pageContent">
  <div class="pp-top">
    <span class="pp-tag" id="ppTag"></span>
    <span class="pp-index" id="ppIndex"></span>
  </div>
  <h1 class="pp-title" id="ppTitle"></h1>
  <div class="pp-org" id="ppOrg"></div>
  <div class="pp-gallery" id="ppGallery"></div>
  <div class="pp-body" id="ppBody"></div>
  <div class="pp-pills" id="ppPills"></div>
  <div id="ppLinkWrap"></div>
  <div class="pp-nav">
    <a class="btn btn-outline" id="ppPrev">← Previous</a>
    <a class="btn btn-outline" href="index.html#projects">All Projects</a>
    <a class="btn btn-outline" id="ppNext">Next →</a>
  </div>
</main>

<!-- FOOTER -->
<footer>
  <span>Adrian Taboada Perez · Engineering Portfolio</span>
  <span>Boston University '26 · Carnegie Mellon University '28</span>
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-counter" id="lightboxCounter"></span>
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous image">&#8249;</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <button class="lightbox-next" id="lightboxNext" aria-label="Next image">&#8250;</button>
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script src="projects-data.js"></script>
<script>
  const ids = Object.keys(PROJECTS).map(Number).sort((a,b) => a - b);
  const params = new URLSearchParams(window.location.search);
  let id = parseInt(params.get('id'), 10);
  if (!PROJECTS[id]) id = ids[0];
  const p = PROJECTS[id];

  document.getElementById('pageTitle').textContent = p.title + " · Adrian Taboada Perez";

  const tagEl = document.getElementById('ppTag');
  tagEl.textContent = p.tagLabel;
  tagEl.className = 'pp-tag ' + p.tagClass;

  document.getElementById('ppIndex').textContent = p.num + " · " + p.category;
  document.getElementById('ppTitle').textContent = p.title;
  document.getElementById('ppOrg').textContent = p.org;

  const galleryImages = p.images || [];
  document.getElementById('ppGallery').innerHTML = galleryImages.map((img, i) =>
    `<figure><div class="pp-img-wrap" data-index="${i}"><img src="${img.src}" alt="${img.caption}" loading="lazy"></div><figcaption class="pp-caption">${img.caption}</figcaption></figure>`
  ).join('');

  document.getElementById('ppBody').innerHTML = p.body.map(par => `<p>${par}</p>`).join('');
  document.getElementById('ppPills').innerHTML = p.pills.map(pl => `<span class="pill">${pl}</span>`).join('');

  document.getElementById('ppLinkWrap').innerHTML = p.link
    ? `<a class="pp-link" href="${p.link.url}" target="_blank" rel="noopener">${p.link.text} →</a>`
    : '';

  const idx = ids.indexOf(id);
  const prevId = ids[(idx - 1 + ids.length) % ids.length];
  const nextId = ids[(idx + 1) % ids.length];
  const prevEl = document.getElementById('ppPrev');
  const nextEl = document.getElementById('ppNext');
  prevEl.href = `project.html?id=${prevId}`;
  nextEl.href = `project.html?id=${nextId}`;
  prevEl.textContent = `← ${PROJECTS[prevId].title}`;
  nextEl.textContent = `${PROJECTS[nextId].title} →`;

  // ── Lightbox ──
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCaption = document.getElementById('lightboxCaption');
  const lightboxCounter = document.getElementById('lightboxCounter');
  let lbIndex = 0;

  function updateLightbox() {
    const img = galleryImages[lbIndex];
    lightboxImg.src = img.src;
    lightboxImg.alt = img.caption;
    lightboxCaption.textContent = img.caption;
    lightboxCounter.textContent = `${lbIndex + 1} / ${galleryImages.length}`;
  }
  function openLightbox(i) {
    lbIndex = i;
    updateLightbox();
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }
  function showPrev() { lbIndex = (lbIndex - 1 + galleryImages.length) % galleryImages.length; updateLightbox(); }
  function showNext() { lbIndex = (lbIndex + 1) % galleryImages.length; updateLightbox(); }

  document.querySelectorAll('.pp-img-wrap').forEach(el => {
    el.addEventListener('click', () => openLightbox(parseInt(el.dataset.index, 10)));
  });
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', showPrev);
  document.getElementById('lightboxNext').addEventListener('click', showNext);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showPrev();
    if (e.key === 'ArrowRight') showNext();
  });
</script>
</body>
</html>
